global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["127.0.0.1:9093"]

  # Node Exporter - System metrics
  - job_name: "node-exporter"
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: "nas"
      - targets: ["quicksilver.tail09544e.ts.net:9100"]
        labels:
          instance: "quicksilver"
      - targets: ["msi-modern.tail09544e.ts.net:9100"]
        labels:
          instance: "msi-modern"
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  - job_name: "smartctl-exporter"
    static_configs:
      - targets: ["127.0.0.1:9633"]
        labels:
          instance: "nas"
          host: "nas"
      - targets: ["msi-modern.tail09544e.ts.net:9633"]
        labels:
          instance: "msi-modern"
          host: "msi-modern"
    scrape_interval: 1m
    scrape_timeout: 10s

  - job_name: "keenetic-snmp"
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /snmp
    params:
      auth: [public_v2]
      module: [if_mib]
    static_configs:
      - targets: ["192.168.1.1"]
        labels:
          host: "keenetic"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "127.0.0.1:9116"

  - job_name: "snmp-exporter"
    static_configs:
      - targets: ["127.0.0.1:9116"]

  - job_name: "pushgateway"
    static_configs:
      - targets: ["localhost:9091"]
    honor_labels: true

# Remote write configuration (optional)
# remote_write:
#   - url: "http://localhost:9201/write"

# Remote read configuration (optional)
# remote_read:
#   - url: "http://localhost:9201/read"
