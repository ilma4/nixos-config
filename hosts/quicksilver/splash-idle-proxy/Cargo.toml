[package]
name = "splash-idle-proxy"
version = "1.0.0"
edition = "2024"

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt", "signal", "sync", "time"] }
