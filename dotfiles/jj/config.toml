#:schema https://docs.jj-vcs.dev/latest/config-schema.json

# Account-specific identity and signing settings are generated by
# home/dev.nix so that JJ follows the effective Git profile (personal/work).

[git]
# Keep JJ colocated with the Git repository and use Git for remote operations.
colocate = true
# Sign mutable commits when pushing.
sign-on-push = true

[working-copy]
# Match Git's core.autocrlf = input.
eol-conversion = "input"

[aliases]
# Fetch one branch from the default GitHub remote.
fetch-once = ["git", "fetch", "--remote", "origin", "--branch"]
