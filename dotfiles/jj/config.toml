#:schema https://docs.jj-vcs.dev/latest/config-schema.json

# Account-specific identity and signing settings are generated by
# home/dev.nix so that JJ follows the effective Git profile (personal/work).

[git]
# Keep JJ colocated with the Git repository and use Git for remote operations.
colocate = true
# Sign mutable commits when pushing.
sign-on-push = true

[working-copy]
# Match Git's core.autocrlf = input.
eol-conversion = "input"

[revsets]
bookmark-advance-to = "@-"

[aliases]
# Fetch one branch from the default GitHub remote.
fetch-once = ["git", "fetch", "--remote", "origin", "--branch"]

# Log the ancestors of a revision, defaulting to `@` (e.g. `jj ll main`).
# Plain aliases can't default a positional argument, so this inlines a small
# script via `jj util exec`; the trailing "" becomes `$0` in bash.
ll = ["util", "exec", "--", "sh", "-c", '''exec jj log -r "::${1:-@}"''', ""]

# Show the changes introduced by a revision, defaulting to the parent of @-.
changes = ["util", "exec", "--", "sh", "-c", '''revision="${1:-@-}"; exec jj diff --from "${revision}-" --to "$revision"''', ""]
